name: Test

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest pytest-cov pytest-asyncio flake8 mypy types-requests beautifulsoup4 types-beautifulsoup4

    - name: Run linting
      run: |
        flake8 cursor_agent_tools tests --config=.flake8
        mypy cursor_agent_tools tests --config-file=.mypy.ini

    - name: Run tests with coverage
      run: |
        # Skip live/API-key and filesystem-heavy suites; keep offline contract tests.
        python -m pytest tests/ -v \
          --ignore=tests/requires_api/ \
          -k "not test_openai_with_proxy and not test_chat_with_user_info and not test_file_tools and not test_image" \
          --cov=cursor_agent_tools --cov-report=term-missing
